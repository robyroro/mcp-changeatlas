[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-changeatlas"
version = "0.1.0"
description = "Local change impact and test discovery for Git repositories over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Robert Vind-Gardoș" }]
keywords = ["mcp", "model-context-protocol", "git", "dependency-analysis", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.11", "mypy>=1.15"]

[project.scripts]
mcp-changeatlas = "changeatlas.cli:main"

[project.urls]
Homepage = "https://github.com/robyroro/mcp-changeatlas"
Repository = "https://github.com/robyroro/mcp-changeatlas"
Issues = "https://github.com/robyroro/mcp-changeatlas/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/changeatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/changeatlas"]
