name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package is on PyPI
        run: |
          version=$(python -c 'import json; print(json.load(open("server.json"))["version"])')
          curl --fail --silent --show-error \
            "https://pypi.org/pypi/mcp-changeatlas/${version}/json" --output /dev/null
      - name: Install publisher
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            --output mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Validate manifest
        run: ./mcp-publisher validate server.json
      - name: Authenticate
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish server.json
