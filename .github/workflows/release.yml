name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy
      - name: Check release version
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          package = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          server = json.load(open("server.json", encoding="utf-8"))
          assert tag == f"v{package}", (tag, package)
          assert server["version"] == package
          assert server["packages"][0]["version"] == package
          PY
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
